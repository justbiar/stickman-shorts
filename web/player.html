<!doctype html>
<html><head><meta charset="utf-8"><title>stickman shorts player</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block;width:100vw;height:auto}</style>
<script type="importmap">{"imports":{"three":"./three.module.min.js"}}</script></head>
<body><canvas id="out" width="1080" height="1920"></canvas>
<script type="module">
// Plays a story file on one of the sets, driven by the narrator's word timings.
//   web/player.html?story=hangar            loads stories/hangar.json + work/hangar.words.json
//   &t=3.2                                  show one frame (for stills); window.frame(t) is what the renderer calls
import * as THREE from "three";
import { EffectComposer } from "./jsm/postprocessing/EffectComposer.js";
import { RenderPass } from "./jsm/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "./jsm/postprocessing/UnrealBloomPass.js";
import { BokehPass } from "./jsm/postprocessing/BokehPass.js";
import { OutputPass } from "./jsm/postprocessing/OutputPass.js";
import { CW, CH, drawCharacter, ACTIONS, FACES } from "./character.js";
import { SETS } from "./sets.js";
import { GLTFLoader } from "./jsm/loaders/GLTFLoader.js";
import { makeChar3D } from "./char3d.js";
import { ACTIONS as KIT_ACTIONS } from "./kit/poses.js";

const W = 1080, H = 1920, q = new URLSearchParams(location.search), NAME = q.get("story") || "hangar";
const story = await (await fetch(`../stories/${NAME}.json`)).json();
let words = []; try { words = await (await fetch(`../work/${NAME}.words.json`)).json(); } catch { }
const DELAY = story.delay ?? .4;                                   // the voice starts this late in the video
words = words.map(w => ({ ...w, s: w.s + DELAY, e: w.e + DELAY }));
const DUR = story.duration ?? ((words.at(-1)?.e ?? 8) + (story.tail ?? 1.3));
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), ease = x => { x = clamp(x); return x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; };
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// ---------- renderer ----------
const gl = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); gl.setSize(W, H, false); gl.setPixelRatio(1);
gl.toneMapping = THREE.ACESFilmicToneMapping; gl.outputColorSpace = THREE.SRGBColorSpace; gl.shadowMap.enabled = true; gl.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene(); const cam = new THREE.PerspectiveCamera(story.fov || 40, W / H, .05, 400);
const comp = new EffectComposer(gl); comp.setSize(W, H); comp.addPass(new RenderPass(scene, cam));
const bokeh = new BokehPass(scene, cam, { focus: 6, aperture: .0009, maxblur: .005 }); comp.addPass(bokeh);
comp.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), .5, .5, .95)); comp.addPass(new OutputPass());
const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, .8); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 2.4); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -.0004;
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 80 }); scene.add(sun, sun.target);

// ---------- helpers handed to the sets ----------
function tex(w, h, draw, rep = [1, 1]) { const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...rep); t.anisotropy = 8; return t; }
const speckle = (g, w, h, n, cols, a = .08) => { for (let i = 0; i < n; i++) { g.fillStyle = cols[Math.floor(rnd() * cols.length)]; g.globalAlpha = a + rnd() * a; g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 3, 1 + rnd() * 3); } g.globalAlpha = 1; };
const M = o => new THREE.MeshStandardMaterial({ roughness: .8, ...o });
const add = (m, p = scene) => (m.castShadow = m.receiveShadow = true, p.add(m), m);
const box = (w, h, d, mat, x, y, z) => { const m = add(new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat)); m.position.set(x, y, z); return m; };
const cyl = (rt, rb, h, mat, x, y, z, seg = 24) => { const m = add(new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat)); m.position.set(x, y, z); return m; };
const ground = mat => { const g = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), mat); g.rotation.x = -Math.PI / 2; g.receiveShadow = true; scene.add(g); return g; };
const sky = (top, mid, bot) => scene.add(new THREE.Mesh(new THREE.SphereGeometry(180, 32, 16), new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { a: { value: new THREE.Color(top) }, b: { value: new THREE.Color(mid) }, c: { value: new THREE.Color(bot) } },
  vertexShader: `varying float y; void main(){ y = normalize(position).y; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `uniform vec3 a,b,c; varying float y; void main(){ vec3 col = y > .08 ? mix(b, a, smoothstep(.08,.6,y)) : mix(c, b, smoothstep(-.1,.08,y)); gl_FragColor = vec4(col,1.); }` })));
const GLOW = (() => { const c = document.createElement("canvas"); c.width = c.height = 128; const g = c.getContext("2d"); const r = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  r.addColorStop(0, "rgba(255,255,255,1)"); r.addColorStop(.3, "rgba(255,255,255,.5)"); r.addColorStop(1, "rgba(255,255,255,0)"); g.fillStyle = r; g.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c); })();
const glow = (col, s, op = 1) => { const m = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color: col, transparent: true, opacity: op, blending: THREE.AdditiveBlending, depthWrite: false })); m.scale.setScalar(s); scene.add(m); return m; };
const signTex = (text, bg = "#f3e6c8", fg = "#3a2414", w = 512, h = 128, font = 64) => tex(w, h, g => { g.fillStyle = bg; g.fillRect(0, 0, w, h); g.strokeStyle = fg; g.lineWidth = 10; g.strokeRect(5, 5, w - 10, h - 10);
  g.fillStyle = fg; g.font = `900 ${font}px Georgia`; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(text, w / 2, h / 2 + 4); });
const particles = (n, size, color, o = {}) => { const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(n * 3), 3));
  const p = new THREE.Points(g, new THREE.PointsMaterial({ size, color, map: GLOW, transparent: true, depthWrite: false, blending: o.additive ? THREE.AdditiveBlending : THREE.NormalBlending, opacity: o.opacity ?? 1 })); p.frustumCulled = false; scene.add(p); return p; };
const wood = (c1, c2, rep) => tex(256, 256, (g, w, h) => { for (let i = 0; i < 8; i++) { g.fillStyle = i % 2 ? c1 : c2; g.fillRect(0, i * h / 8, w, h / 8); g.fillStyle = "rgba(0,0,0,.3)"; g.fillRect(0, i * h / 8, w, 2); } speckle(g, w, h, 2500, ["#000", "#fff"], .04); }, rep);
const light = o => { sun.position.set(...o.sun); sun.color.set(o.sunColor); sun.intensity = o.sunI; hemi.color.set(o.sky); hemi.groundColor.set(o.groundCol); hemi.intensity = o.hemiI; };

// characters: a canvas-drawn figure on a plane that turns to face the camera
const cast = {}, spots = {};
function character(id, c, [x, z], look = "front", show = true, scale = 1.75) {
  if (story.chars3d) { const rig = makeChar3D(THREE, c); rig.group.position.set(x, 0, z); rig.group.visible = show; scene.add(rig.group);
    return cast[id] = { c, rig, mesh: rig.group, act: "idle", face: "neutral", look, home: [x, z], show }; }
  const cv = document.createElement("canvas"); cv.width = CW; cv.height = CH; const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  const geo = new THREE.PlaneGeometry(1.0 * scale, 1.5 * scale); geo.translate(0, .75 * scale, 0);
  const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: t, color: new THREE.Color(.8, .8, .78), transparent: true, alphaTest: .4, toneMapped: false, side: THREE.DoubleSide }));
  mesh.castShadow = true; mesh.customDepthMaterial = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map: t, alphaTest: .4 }); mesh.position.set(x, 0, z); mesh.visible = show; scene.add(mesh);
  return cast[id] = { c: { skin: "#ffffff", ...c }, ctx: cv.getContext("2d"), t, mesh, act: "idle", face: "neutral", look, home: [x, z], show };
}
const spot = (name, p, camOff = [0, 0, 4]) => spots[name] = { p: new THREE.Vector3(...p), cam: new THREE.Vector3(...camOff) };

// asset loading for sets built from real models and photo textures (assets/ = CC0 files from Poly Haven)
const gltfL = new GLTFLoader(), texL = new THREE.TextureLoader(), pending = [];
const model = (name, pos, scale = 1, rotY = 0) => pending.push(new Promise(res => gltfL.load(`assets/${name}/${name}_1k.gltf`, g => { const o = g.scene; o.position.set(...pos); o.scale.setScalar(scale); o.rotation.y = rotY;
  o.traverse(m => { if (m.isMesh) { m.castShadow = m.receiveShadow = true; } }); scene.add(o); res(o); }, undefined, () => res(null))));
const photo = (folder, rep = [1, 1], o = {}) => { const ld = (f, srgb) => { let done; pending.push(new Promise(r => done = r)); const t = texL.load(`assets/${folder}/${f}.jpg`, () => done(), undefined, () => done()); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...rep); t.anisotropy = 8; if (srgb) t.colorSpace = THREE.SRGBColorSpace; return t; };
  return new THREE.MeshStandardMaterial({ map: ld("Diffuse", true), normalMap: ld("nor_gl"), roughnessMap: ld("Rough"), aoMap: o.ao ? ld("AO") : null, color: o.tint ?? 0xffffff, side: o.side ?? THREE.FrontSide, metalness: o.metal ?? 0, normalScale: new THREE.Vector2(o.bump ?? 1, o.bump ?? 1) }); };
const k = { THREE, scene, sun, hemi, M, add, box, cyl, ground, sky, glow, tex, speckle, signTex, particles, wood, rnd, light, character, spot, model, photo, gl, bloomPass: null };
const set = SETS[story.style](k);
await Promise.all(pending); for (let i = 0; i < 20; i++) await new Promise(r => setTimeout(r, 50));
for (const [id, o] of Object.entries(story.cast || {})) { const ch = cast[id]; if (!ch) continue; if (o.pos) ch.home = o.pos; if (o.look) ch.look = o.look; if (o.show != null) ch.show = o.show; if (o.costume) Object.assign(ch.c, o.costume); }

// ---------- timing: "at" is seconds, a word ("holes"), or the nth time a word is said ("holes#2") ----------
const norm = s => String(s).toLowerCase().replace(/[^a-z0-9']/g, "");
function at(a) { if (typeof a === "number") return a; const [w, n] = String(a).split("#"); let seen = 0;
  for (const x of words) if (norm(x.w) === norm(w) && ++seen === Number(n || 1)) return x.s - .05;
  console.warn("no word", a); return 0; }
const beats = story.beats.map(b => ({ ...b, t: at(b.at ?? 0) })).sort((a, b) => a.t - b.t);
beats.forEach((b, i) => b.end = beats[i + 1]?.t ?? DUR);
const events = beats.flatMap(b => [].concat(b.fx || []).map(name => ({ name, t: b.t })));
window.duration = DUR; window.timeline = { duration: DUR, cuts: beats.map(b => ({ t: +b.t.toFixed(3), cam: b.cam || "medium" })), events: events.map(e => ({ ...e, t: +e.t.toFixed(3) })) };

// the state of every character at time t = all beat changes up to t applied in order
function castAt(t) { const st = {}; for (const [id, ch] of Object.entries(cast)) st[id] = { act: "idle", face: "neutral", look: ch.look, show: ch.show, pos: ch.home };
  for (const b of beats) { if (b.t > t) break; for (const [id, v] of Object.entries(b.do || {})) { const [act, face, look] = v.split(" "); Object.assign(st[id], act && act !== "-" ? { act } : {}, face && face !== "-" ? { face } : {}, look ? { look } : {}); }
    for (const id of b.show || []) st[id].show = true; for (const id of b.hide || []) st[id].show = false; for (const [id, p] of Object.entries(b.pos || {})) st[id].pos = p; }
  return st; }

// ---------- camera ----------
const SHOT = { wide: [7, 1.7, 1.3], medium: [4.2, 1.7, 1.6], close: [2.6, 1.85, 1.75], low: [3.4, .45, 1.9], high: [4.4, 4.6, 1.0] };
function shotAt(b, t) { const k2 = ease((t - b.t) / Math.max(.5, b.end - b.t)), push = 1 - (b.push ?? .3) * .22 * k2, rise = (b.rise ?? 0) * k2;
  if (b.cam === "insert" || spots[b.on]) { const s = spots[b.on]; const off = s.cam.clone().multiplyScalar(push); off.applyAxisAngle(new THREE.Vector3(0, 1, 0), (b.orbit ?? 0) * (1 + .15 * k2)); off.y += rise;
    return { pos: s.p.clone().add(off), look: s.p.clone().add(new THREE.Vector3(0, rise * .6, 0)) }; }
  const ids = [].concat(b.on || Object.keys(cast)[0]); const T = new THREE.Vector3(); ids.forEach(id => T.add(cast[id].mesh.position)); T.multiplyScalar(1 / ids.length);
  const [d0, cy, ly] = SHOT[b.cam || "medium"]; const d = d0 * (ids.length > 1 ? 1.25 : 1) * push;
  const dir = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), (b.orbit ?? 0) + .08 * k2 * Math.sign(b.orbit ?? 1));
  return { pos: T.clone().add(dir.multiplyScalar(d)).add(new THREE.Vector3(0, cy + rise, 0)), look: T.clone().add(new THREE.Vector3(0, ly + rise * .5, 0)) }; }

// ---------- 2D overlay: captions, labels, flashes ----------
const out = document.getElementById("out"), ctx = out.getContext("2d");
const isNum = w => /\d/.test(w);
function caption(t) { const i = words.findIndex(w => t >= w.s && t < (words[words.indexOf(w) + 1]?.s ?? w.e + .4)); if (i < 0) return;
  const w = words[i].w.replace(/[",.!?;:]+$/g, "").replace(/^"/, ""); const age = t - words[i].s, s = 1 + .14 * Math.max(0, 1 - age / .12);
  ctx.save(); ctx.translate(W / 2, 1490); ctx.scale(s, s); ctx.font = `900 92px "Avenir Next", "Helvetica Neue", sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
  ctx.lineWidth = 16; ctx.strokeStyle = "rgba(12,10,16,.9)"; ctx.strokeText(w, 0, 0); ctx.fillStyle = isNum(w) ? "#ffd23a" : "#ffffff"; ctx.fillText(w, 0, 0); ctx.restore(); }
function label(b, t) { const L = b.label; if (!L) return; const dur = L.for ?? (b.end - b.t); const age = t - b.t; if (age < 0 || age > dur) return;
  const p = (spots[L.on]?.p.clone() ?? cast[L.on]?.mesh.position.clone().add(new THREE.Vector3(0, 2.9, 0)) ?? new THREE.Vector3()).add(new THREE.Vector3(0, L.dy ?? .2, 0)).project(cam);
  let x = (p.x * .5 + .5) * W, y = (-p.y * .5 + .5) * H; x = clamp(x, 260, W - 260); y = clamp(y, 260, 1180); const s = ease(age / .22) * (1 - ease((age - dur + .2) / .2));
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.font = `800 56px "Avenir Next", sans-serif`; const tw = ctx.measureText(L.text).width + 56;
  ctx.fillStyle = L.bg || "#ffd23a"; ctx.beginPath(); ctx.roundRect(-tw / 2, -44, tw, 88, 44); ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = "#141018"; ctx.stroke();
  ctx.fillStyle = L.fg || "#141018"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(L.text, 0, 3); ctx.restore(); }

// ---------- one frame ----------
window.frame = function (t) {
  const req = set.fx?.(t, events); const st = castAt(t);
  const b = beats.filter(x => x.t <= t).pop() || beats[0];
  for (const [id, ch] of Object.entries(cast)) { const s = st[id]; ch.mesh.visible = s.show; ch.mesh.position.set(s.pos[0], 0, s.pos[1]);
    const f = { ...FACES[s.face] }; if (s.act === "talk") f.talk = .5 + .5 * Math.sin(t * 20) * Math.sin(t * 8.4);
    if (ch.rig) { ch.rig.update((KIT_ACTIONS[s.act] || KIT_ACTIONS.idle)(t), s.face, { t, talk: f.talk || 0, look: s.look, blink: (t + ch.home[0]) % 3.3 < .1 }); continue; }
    if ((t + ch.home[0]) % 3.3 < .1 && f.eyes === "open") f.eyes = "closed"; drawCharacter(ch.ctx, ch.c, ACTIONS[s.act](t), f, s.look); ch.t.needsUpdate = true; }
  const { pos, look } = shotAt(b, t);
  const shakeE = events.filter(e => (e.name === "boom" || e.name === "shake") && t >= e.t).pop(), sh = shakeE ? Math.max(0, 1 - (t - shakeE.t) / .7) : 0;
  pos.x += Math.sin(t * 1.3) * .03 + Math.sin(t * 47) * .09 * sh; pos.y += Math.sin(t * 1.7) * .02 + Math.sin(t * 61) * .07 * sh;
  cam.position.copy(pos); cam.lookAt(look);
  for (const ch of Object.values(cast)) ch.mesh.rotation.y = Math.atan2(cam.position.x - ch.mesh.position.x, cam.position.z - ch.mesh.position.z);
  sun.target.position.copy(look); bokeh.uniforms.focus.value = cam.position.distanceTo(look);
  comp.render(); ctx.clearRect(0, 0, W, H); ctx.drawImage(gl.domElement, 0, 0);
  const fl = events.filter(e => (e.name === "flash" || e.name === "boom") && t >= e.t).pop(); const fa = fl ? Math.max(0, 1 - (t - fl.t) / .35) : 0;
  if (fa > 0 || req === "flash") { ctx.fillStyle = fl?.name === "boom" ? `rgba(255,190,120,${Math.max(fa, req ? .4 : 0) * .8})` : `rgba(230,236,255,${Math.max(fa, req ? .4 : 0) * .7})`; ctx.fillRect(0, 0, W, H); }
  beats.forEach(x => label(x, t)); caption(t);
  const fade = Math.min(clamp(t / .25), clamp((DUR - t) / .35)); if (fade < 1) { ctx.fillStyle = `rgba(0,0,0,${1 - fade})`; ctx.fillRect(0, 0, W, H); }
  return true;
};
window.ready = true; window.frame(Number(q.get("t") || 1));
window.png = async () => { await new Promise(r => setTimeout(r, 300)); window.frame(Number(q.get("t") || 1)); return out.toDataURL("image/png"); };
</script></body></html>
